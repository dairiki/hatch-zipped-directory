[project]
name = "hatch-zipped-directory"
description = 'A custom builder to build zipped directories'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["hatch", "packaging"]
authors = [
  { name = "Jeff Dairiki", email = "dairiki@dairiki.org" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Plugins",
  "Framework :: Hatch",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: System :: Archiving :: Packaging",
]
dependencies = [
    "hatchling",
]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/dairiki/hatch-zipped-directory"
Changes = "https://github.com/dairiki/hatch-zipped-directory/blob/master/CHANGES.md"

[project.entry-points.hatch]
zipped-directory = "hatch_zipped_directory.hooks"

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]
test = [
    {include-group = "cover"},
    "hatch>=1.18.0",            # required by test_functional.py
    "pytest>=9.1.1",
]
cover = [
    "coverage>=7.15.4",
]
lint = [
    "mypy>=2.3.1",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
[tool.hatch.build.targets.sdist]
include = [
    "/hatch_zipped_directory",
    "/tests",
    "/CHANGES.md",
    "/README.md",
]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.paths]
source = [
    "hatch_zipped_directory/",
    # Attempt to match source files on various GitHub Windows/macOS runners
    "**/hatch_zipped_directory/",
]
tests = [
    "tests/",
    "**/hatch-zipped-directory/tests/",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
[tool.ruff.lint]
extend-select = [
  "UP",
  "FURB",
]

[tool.mypy]
files = ["hatch_zipped_directory/**.py", "tests/**.py"]
strict = true
