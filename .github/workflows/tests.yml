name: Test and Build

on:
  workflow_call:
    outputs:
      version-type:
        description: |
          Type of version (from VCS version). This is one of 'local', 'dev', 'pre', or 'release'.

          Note that unless a commit is tagged, the version type will always be 'local'.
        value: ${{ jobs.build.outputs.version-type }}
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 2'

jobs:
  tests:
    name: python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv (with python ${{ matrix.python-version }})
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.12.5
        python-version: ${{ matrix.python-version }}

    - run: uv sync --locked --no-dev --group=test

    - run: uv run --no-sync coverage run -m pytest tests -ra

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.os }}
          path: ".coverage.*"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  cover:
    name: Coverage
    if: ${{ always() }}
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.12.5

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
          pattern: coverage-*
          merge-multiple: true

    - run: uv sync --locked --only-group=cover

    - run: uv run --no-sync coverage combine

    - run: uv run --no-sync coverage report --fail-under 100 --show-missing

  lint:
    name: Lint
    runs-on: 'ubuntu-latest'
    env:
      python-version: "3.13"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.12.5
        python-version: ${{ env.python-version }}

    - name: pre-commit cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: py-${{ env.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run mypy
      run: uv run mypy

    - run: uv tool run prek run -a
      if: always()

  build:
    name: Build distribution
    needs: [tests, cover, lint]
    runs-on: ubuntu-latest
    outputs:
      version-type: ${{ steps.classify-version.outputs.version-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5

      - run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Classify Version
        id: classify-version
        run: |
          uv run python -c '
          import sys
          from importlib import metadata
          from packaging.version import parse as parse_version, Version

          version = metadata.version("hatch_zipped_directory")
          match parse_version(version):
              case Version(pre=None, dev=None, local=None):
                  version_type = "release"
              case Version(dev=None, local=None):
                  version_type = "pre"
              case Version(local=None):
                  version_type = "dev"
              case _:
                  version_type = "local"
          print(f"version-type={version_type}")
          print(f"version-type={version_type}, version={version}", file=sys.stderr)
          ' >> "$GITHUB_OUTPUT"
