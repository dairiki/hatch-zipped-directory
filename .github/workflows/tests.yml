name: Test and Build

on:
  workflow_call:
    outputs:
      version-type:
        description: |
          Type of version (from VCS version). This is one of 'local', 'dev', 'pre', or 'release'.

          Note that unless a commit is tagged, the version type will always be 'local'.
        value: ${{ jobs.build.outputs.version-type }}
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 2'

jobs:
  tests:
    name: python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15-dev']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      id: setup-python
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install hatch
      run: python -m pip install hatch

    - run: hatch run full
      env:
        HATCH_PYTHON: ${{ steps.setup-python.outputs.python-path }}

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.os }}
          path: ".coverage.*"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
          name: artifacts-${{ matrix.python-version }}-${{ matrix.os }}
          path: artifacts/
          retention-days: 7

  cover:
    name: Coverage
    if: ${{ always() }}
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install hatch
      run: python -m pip install hatch

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
          pattern: coverage-*
          merge-multiple: true

    - run: hatch run coverage combine

    - run: hatch run coverage report --fail-under 100 --show-missing

  lint:
    name: Lint
    runs-on: 'ubuntu-latest'
    env:
      python-version: "3.13"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.python-version }}

    - name: pre-commit cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: py-${{ env.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Install hatch
      run: python -m pip install hatch

    - name: Install pre-commit
      run: python -m pip install pre-commit

    - name: Run mypy
      run: hatch run dev:mypy hatch_zipped_directory

    - run: pre-commit run -a
      if: always()

  build:
    name: Build distribution
    needs: [tests, cover, lint]
    runs-on: ubuntu-latest
    outputs:
      version-type: ${{ steps.classify-version.outputs.version-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: python -m pip install hatch packaging

      - run: hatch build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Classify Version
        id: classify-version
        run: |
          hatch version | python -c '
          import sys, packaging.version
          version = packaging.version.parse(sys.stdin.read())
          if version.local:
              version_type = "local"
          elif version.is_devrelease:
              version_type = "dev"
          elif version.is_prerelease:
              version_type = "pre"
          else:
              version_type = "release"
          print(f"version-type={version_type}")
          print(f"version-type={version_type}", file=sys.stderr)
          ' >> "$GITHUB_OUTPUT"
